name: CI (Full)

# Unit + integration suites against a live mock z2m bridge, plus the iPad
# matrix. Triggers:
#   1. Every PR to main (a release PR can't merge without us seeing this)
#   2. Nightly at 03:00 UTC (catches environmental drift on main)
#   3. On demand from the Actions tab
#
# Not a required check, but a red run on main opens a `ci-failure` issue
# (see the notify job) so it can't go unnoticed.
#
# The broader iPhone UI smoke suite stays opt-in while its legacy coverage
# is stabilized: label the PR `run-ui-tests` (then push or re-run) or tick
# "ui_smoke" when dispatching.
#
# Typical duration: ~20 min.

on:
  schedule:
    # 03:00 UTC daily. Cron syntax: minute hour day month day-of-week.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running the full suite?'
        required: false
        default: 'Manual run'
      ui_smoke:
        description: 'Also run the iPhone UI smoke suite'
        type: boolean
        default: false
      audit_skipped:
        description: 'Also run every unit test the CI plans skip, to see which still fail'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'marketing/**'

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit + Integration Tests
    runs-on: macos-15
    timeout-minutes: 35

    env:
      SCHEME: Shellbee
      TEST_PLAN: Shellbee
      TEST_TARGET: ShellbeeTests
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/DerivedData/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Start dual mock Z2M bridges (native)
        env:
          MULTI_BRIDGE: "1"
          # The integration tests open one connection each. Replaying retained
          # state is sufficient; a 173-device drift burst per connection only
          # overloads the bridge and makes first-frame timing nondeterministic.
          DRIFT_ON_CLIENT_CONNECT: "0"
          MOCK_SEED_INTERVAL: "60"
        run: ./.github/scripts/start-mock-bridge.sh

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Pick simulator
        id: sim
        run: ./.github/scripts/pick-simulator.sh 'iPhone.*Pro Max' '^iPhone'

      - name: Boot simulator and wait for readiness
        timeout-minutes: 4
        run: |
          # `simctl bootstatus -b` boots (if not already) and BLOCKS until the
          # device is actually ready (springboard up, services responding) —
          # not just "Booted" state. The previous state-check loop returned
          # too early, leaving xcodebuild waiting on a not-yet-ready simulator
          # which silently hung for the full 30-minute test timeout.
          DEVICE_ID="${{ steps.sim.outputs.device_id }}"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build for testing
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee build-unit.log

      - name: Run unit tests
        timeout-minutes: 15
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          # Everything except the suites that need a live mock bridge,
          # which run in the next step.
          set -o pipefail
          xcodebuild test-without-building \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            -only-testing:"$TEST_TARGET" \
            -skip-testing:"ShellbeeTests/Z2MIntegrationTests" \
            -skip-testing:"ShellbeeTests/MultiBridgeIntegrationTests" \
            -skip-testing:"ShellbeeTests/GroupDropIntegrationTests" \
            -skip-testing:"ShellbeeTests/NetworkMapIntegrationTests" \
            -resultBundlePath "$DERIVED_DATA/UnitTests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee test-unit.log

      - name: Run mock bridge integration tests
        timeout-minutes: 15
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          # Keep the live WebSocket suites separate from deterministic unit
          # tests. A single retry is limited to these network integration tests
          # because the macOS runner occasionally delays the mock bridge's
          # replay of its retained fixture set during a handshake.
          set -o pipefail
          xcodebuild test-without-building \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            -only-testing:"ShellbeeTests/Z2MIntegrationTests" \
            -only-testing:"ShellbeeTests/MultiBridgeIntegrationTests" \
            -only-testing:"ShellbeeTests/GroupDropIntegrationTests" \
            -only-testing:"ShellbeeTests/NetworkMapIntegrationTests" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$DERIVED_DATA/IntegrationTests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee test-integration.log

      - name: Capture mock bridge logs
        if: always()
        run: |
          cp "$RUNNER_TEMP/z2m-bridge.log" mock-bridge.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder.log" mock-seeder.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-bridge-2.log" mock-bridge-2.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder-2.log" mock-seeder-2.log 2>/dev/null || true

      - name: Report results
        if: always()
        env:
          FAILURES_OUT: failures-unit.md
        run: |
          ./.github/scripts/report-xcresult.sh "$DERIVED_DATA/UnitTests.xcresult" "Unit tests"
          if [ -d "$DERIVED_DATA/IntegrationTests.xcresult" ]; then
            ./.github/scripts/report-xcresult.sh "$DERIVED_DATA/IntegrationTests.xcresult" "Mock bridge integration tests"
          fi

      - name: Upload failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-unit
          path: failures-unit.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-unit-logs
          path: |
            build-unit.log
            test-unit.log
            test-integration.log
            mock-bridge.log
            mock-seeder.log
            mock-bridge-2.log
            mock-seeder-2.log
            ${{ env.DERIVED_DATA }}/UnitTests.xcresult
            ${{ env.DERIVED_DATA }}/IntegrationTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  ipad-build:
    name: iPad build (build-only)
    runs-on: macos-15
    timeout-minutes: 15

    env:
      SCHEME: Shellbee
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/DerivedData/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Pick iPad simulator
        id: sim
        run: ./.github/scripts/pick-simulator.sh '^iPad'

      - name: Build for iPad
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee build-ipad.log

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-ipad-logs
          path: |
            build-ipad.log
          if-no-files-found: ignore
          retention-days: 14

  ipad-ui-tests:
    name: iPad UI (${{ matrix.form_factor }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - form_factor: mini
            name_regex: iPad mini
          - form_factor: 13-inch
            name_regex: iPad Pro.*13-inch

    env:
      SCHEME: Shellbee
      TEST_PLAN: Shellbee
      IPAD_CLASSES: IPadShellMatrixUITests MultiWindowUITests
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/DerivedData/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Start duplicate-name dual mock bridges
        env:
          MULTI_BRIDGE: "1"
          SECONDARY_DUPLICATE_NAMES: "1"
          DRIFT_ON_CLIENT_CONNECT: "0"
          MOCK_SEED_INTERVAL: "60"
        run: ./.github/scripts/start-mock-bridge.sh

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Pick representative iPad simulator
        id: sim
        env:
          NAME_REGEX: ${{ matrix.name_regex }}
        run: ./.github/scripts/pick-simulator.sh "$NAME_REGEX"

      - name: Boot simulator and wait for readiness
        timeout-minutes: 4
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.device_id }}" -b

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build iPad UI tests
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee build-ipad-ui.log

      - name: Run adaptive iPad behavior tests
        timeout-minutes: 20
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          # One retry absorbs a simulator hiccup; a test that needs it is
          # still flagged as flaky in the report. A real regression fails
          # both attempts and fails the job.
          ONLY=()
          for class in $IPAD_CLASSES; do ONLY+=("-only-testing:ShellbeeUITests/$class"); done
          set -o pipefail
          xcodebuild test-without-building \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            "${ONLY[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$DERIVED_DATA/IPadMatrix.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee test-ipad-ui.log

      - name: Capture mock bridge logs
        if: always()
        run: |
          cp "$RUNNER_TEMP/z2m-bridge.log" mock-bridge.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder.log" mock-seeder.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-bridge-2.log" mock-bridge-2.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder-2.log" mock-seeder-2.log 2>/dev/null || true

      - name: Report results
        if: always()
        env:
          FAILURES_OUT: failures-ipad-${{ matrix.form_factor }}.md
        run: ./.github/scripts/report-xcresult.sh "$DERIVED_DATA/IPadMatrix.xcresult" "iPad UI (${{ steps.sim.outputs.device_name }})"

      - name: Upload failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-ipad-${{ matrix.form_factor }}
          path: failures-ipad-${{ matrix.form_factor }}.md
          if-no-files-found: ignore
          retention-days: 3

      # Always kept: a test that passed only on retry leaves its first
      # attempt's screenshots and hierarchy here, which is the only way
      # to tell a slow test from a real race.
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-ipad-${{ matrix.form_factor }}
          path: |
            build-ipad-ui.log
            test-ipad-ui.log
            mock-bridge.log
            mock-seeder.log
            mock-bridge-2.log
            mock-seeder-2.log
            ${{ env.DERIVED_DATA }}/IPadMatrix.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: iPhone UI (${{ matrix.shard }})
    # Opt-in: PR labeled `run-ui-tests`, or dispatched with ui_smoke. The
    # suite was dormant during the multi-bridge redesign (#83); it stays
    # out of the default run until it's green, and out of the notify job
    # so an opt-in experiment never opens a ci-failure issue.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'run-ui-tests') ||
      (github.event_name == 'workflow_dispatch' && inputs.ui_smoke)
    runs-on: macos-15
    timeout-minutes: 60
    # Split by class so each shard fits well inside its time budget. A new
    # UI test class must be added to one shard or it never runs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: devices
            classes: DeviceDetailUITests DeviceListUITests SearchUITests
          - shard: groups-home
            classes: GroupsUITests HomeUITests HomeDashboardUITests
          - shard: settings
            classes: SettingsUITests ActivityCenterEnabledSettingsUITests ActivityInstrumentGalleryUITests IconGalleryUITests ThemeUITests
          - shard: activity-connection
            classes: ActivityUITests ActivityCenterDisabledUITests ConnectionFlowUITests DisconnectUITests

    env:
      SCHEME: Shellbee
      TEST_PLAN: Shellbee
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/DerivedData/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Both bridges: some suites (Home dashboard) add the secondary.
      - name: Start dual mock Z2M bridges (native)
        env:
          MULTI_BRIDGE: "1"
        run: ./.github/scripts/start-mock-bridge.sh

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Pick simulator
        id: sim
        run: ./.github/scripts/pick-simulator.sh 'iPhone.*Pro Max' '^iPhone'

      - name: Boot simulator
        timeout-minutes: 4
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.device_id }}" -b

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -derivedDataPath "$DERIVED_DATA"

      - name: Build for testing
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee build-ui.log

      - name: Run UI tests
        timeout-minutes: 45
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
          CLASSES: ${{ matrix.classes }}
        run: |
          # Serial: parallel testing clones the simulator, which hangs on
          # the hosted runner with zero tests run (#83), and every UI test
          # shares one mock bridge anyway.
          ONLY=()
          for class in $CLASSES; do ONLY+=("-only-testing:ShellbeeUITests/$class"); done
          set -o pipefail
          xcodebuild test-without-building \
            -project Shellbee.xcodeproj -scheme "$SCHEME" \
            -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            "${ONLY[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$DERIVED_DATA/UITests.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee test-ui.log

      - name: Capture mock bridge logs
        if: always()
        run: |
          cp "$RUNNER_TEMP/z2m-bridge.log" mock-bridge.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder.log" mock-seeder.log 2>/dev/null || true
          cp "$RUNNER_TEMP/z2m-seeder-2.log" mock-seeder-2.log 2>/dev/null || true

      - name: Report results
        if: always()
        env:
          FAILURES_OUT: failures-iphone-${{ matrix.shard }}.md
        run: ./.github/scripts/report-xcresult.sh "$DERIVED_DATA/UITests.xcresult" "iPhone UI (${{ matrix.shard }})"

      - name: Upload failure list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures-iphone-${{ matrix.shard }}
          path: failures-iphone-${{ matrix.shard }}.md
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-full-iphone-${{ matrix.shard }}
          path: |
            build-ui.log
            test-ui.log
            mock-bridge.log
            mock-seeder.log
            ${{ env.DERIVED_DATA }}/UITests.xcresult
          if-no-files-found: ignore
          retention-days: 7


  skipped-audit:
    name: Audit skipped unit tests
    # Dispatch-only. Runs exactly the tests Shellbee-CI.xctestplan skips
    # (minus the live-bridge suites, which the unit job already runs) so a
    # skip can be deleted as soon as it passes, and a real crash is seen.
    if: github.event_name == 'workflow_dispatch' && inputs.audit_skipped
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: Shellbee
      TEST_PLAN: Shellbee
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - uses: actions/checkout@v4

      - name: Start dual mock Z2M bridges (native)
        env:
          MULTI_BRIDGE: "1"
          DRIFT_ON_CLIENT_CONNECT: "0"
          MOCK_SEED_INTERVAL: "60"
        run: ./.github/scripts/start-mock-bridge.sh

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Pick simulator
        id: sim
        run: ./.github/scripts/pick-simulator.sh 'iPhone.*Pro Max' '^iPhone'

      - name: Boot simulator
        timeout-minutes: 4
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.device_id }}" -b

      - name: Run skipped tests
        continue-on-error: true
        env:
          DESTINATION: platform=iOS Simulator,id=${{ steps.sim.outputs.device_id }}
        run: |
          PLAN=Shellbee.xcodeproj/xcshareddata/xctestplans/Shellbee-CI.xctestplan
          ONLY=()
          while read -r t; do
            ONLY+=("-only-testing:ShellbeeTests/${t%()}")
          done < <(jq -r '.testTargets[] | select(.target.name == "ShellbeeTests")
                          | .skippedTests[]
                          | select(. != "Z2MIntegrationTests" and . != "MultiBridgeIntegrationTests")' "$PLAN")
          printf '%s\n' "${ONLY[@]}"
          set -o pipefail
          xcodebuild test \
            -project Shellbee.xcodeproj -scheme "$SCHEME" -testPlan "$TEST_PLAN" \
            -destination "$DESTINATION" -derivedDataPath "$DERIVED_DATA" \
            "${ONLY[@]}" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "$DERIVED_DATA/SkippedAudit.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee audit.log

      - name: Report results
        if: always()
        run: ./.github/scripts/report-xcresult.sh "$DERIVED_DATA/SkippedAudit.xcresult" "Skipped unit tests (audit)"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skipped-audit
          path: |
            audit.log
            ${{ env.DERIVED_DATA }}/SkippedAudit.xcresult
          if-no-files-found: ignore
          retention-days: 7

  notify:
    name: Notify on main
    # Only for runs of main (nightly or dispatched). A PR's failures show
    # on the PR itself. Cancelled runs say nothing either way.
    needs: [unit-tests, ipad-build, ipad-ui-tests]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Collect failing tests
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: failures-*
          path: failures
          merge-multiple: true

      - name: Open, update or close the ci-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            {
              echo "**Failed jobs:**"
              gh run view "$GITHUB_RUN_ID" --json jobs \
                --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.url))"'
              echo
              cat failures/*.md 2>/dev/null || true
            } > details.md
            ./.github/scripts/ci-failure-issue.sh failure details.md
          elif [ "$CANCELLED" != "true" ]; then
            ./.github/scripts/ci-failure-issue.sh success
          fi
