name: Prepare Release

# Regenerates bundled device docs and images from Koenkk/zigbee2mqtt.io and
# opens, validates, and merges a PR if anything changed. Runs:
#   1. Weekly on Mondays at 04:00 UTC — keeps bundles fresh between releases.
#   2. On manual dispatch — run this before tagging a release to pull in any
#      upstream changes that landed since the last weekly.
#
# The actual generation is done by Tools/generate-bundle.swift, which clones
# the upstream repo, rebuilds the three LZFSE bundles in Shellbee/Resources/,
# and skips work if nothing upstream changed (--force bypasses the skip).
#
# If bundles are unchanged, the job exits quietly without opening a PR.
# Refresh PRs run Fast CI through workflow_dispatch because GitHub suppresses
# pull_request workflows for PRs created with GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this?'
        required: false
        default: 'Pre-release docs refresh'

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  refresh-bundles:
    name: Refresh bundled docs and images
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We push a new branch from this workflow, so we need a token that
          # can write to the repo. GITHUB_TOKEN is granted that via the
          # `permissions` block above.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Regenerate bundles
        run: |
          # The script clones Koenkk/zigbee2mqtt.io into the target path if
          # it doesn't exist, then generates the LZFSE bundles. --force
          # rebuilds even if the hash file indicates no change.
          swift Tools/generate-bundle.swift --force /tmp/zigbee2mqtt.io

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet Shellbee/Resources/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Bundles unchanged — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## Changes detected" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat Shellbee/Resources/ >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open PR with refreshed bundles
        id: pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # Include the run id so re-runs on the same day don't collide with a
          # previously pushed branch (which would cause a non-fast-forward push
          # rejection). Each run gets its own branch.
          BRANCH="chore/refresh-bundles-${DATE}-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add Shellbee/Resources/
          git commit -m "Refresh bundled docs and images (${DATE})" \
                     -m "Regenerated via Tools/generate-bundle.swift from the latest Koenkk/zigbee2mqtt.io. Auto-opened by prepare-release workflow."
          git push -u origin "$BRANCH"

          # Use the trigger reason in the PR body when dispatched manually.
          REASON="${{ github.event.inputs.reason || 'Weekly scheduled refresh' }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Write the PR body to a file with a quoted heredoc so apostrophes
          # and backticks in the body don't get interpreted by the shell. Using
          # `gh pr create --body-file` avoids the $(cat <<EOF) parsing quirk
          # that previously broke this step on macOS bash.
          cat > /tmp/pr-body.md <<'BODY'
          ## Summary
          Regenerated `Shellbee/Resources/device_docs.lzfse`, `device_images.lzfse`, and `device_index.lzfse` from the latest [Koenkk/zigbee2mqtt.io](https://github.com/Koenkk/zigbee2mqtt.io).

          **Trigger:** __REASON__
          **Run:** __RUN_URL__

          ## Automation
          Fast CI is dispatched for this commit. The workflow squash-merges this PR automatically after CI succeeds.

          ## Test plan
          - [ ] Skim the diff — file sizes should change but not structure
          - [ ] If you are about to tag a release, merge this first so the release ships current docs
          BODY

          # Inject runtime values without going through shell-quote hell.
          sed -i '' -e "s|__REASON__|${REASON}|" -e "s|__RUN_URL__|${RUN_URL}|" /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh bundled docs and images (${DATE})" \
            --body-file /tmp/pr-body.md)

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Dispatch Fast CI
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          gh workflow run ci-fast.yml \
            --ref "$BRANCH" \
            -f reason="Validate automatic bundle refresh"

      - name: Wait for Fast CI
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow=ci-fast.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" \
              | head -n1)
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$RUN_ID" ]; then
            echo "Fast CI run was not created for $HEAD_SHA" >&2
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status --interval 10

      - name: Squash-merge refreshed bundles
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
